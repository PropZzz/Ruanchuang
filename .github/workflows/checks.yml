name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web sources, tests and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/check_web_sources.mjs
      - run: node --test tools/tests/*.test.mjs
      - run: node tools/build_stitch_web.mjs
      - run: bash -n deploy/bootstrap_backend.sh
      - run: git diff --check

  backend:
    name: Backend (${{ matrix.os }}, Python 3.13)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  flutter:
    name: Flutter and scheduling parity (Windows)
    # The committed pixel goldens were captured on Windows. Keep the same
    # rendering platform; the backend also runs independently on Linux.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: python -m pip install -r backend/requirements.txt
      - name: Restore the committed Flutter dependency resolution
        run: dart pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: python scripts/scheduling_parity.py --reports-dir build/ci-parity
