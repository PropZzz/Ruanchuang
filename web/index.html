<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8fe">
  <meta name="description" content="时序智配时间地图工作台">
  <title>时序智配</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body, #prototype-screen {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #faf8fe;
    }

    body {
      overscroll-behavior: none;
    }

    #prototype-screen {
      display: block;
      opacity: 1;
      transform: translateY(0);
      transition-property: opacity, transform;
      transition-duration: 220ms;
      transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    }

    #prototype-screen.route-switching {
      opacity: 0;
      transform: translateY(6px);
    }

    @media (prefers-reduced-motion: reduce) {
      #prototype-screen {
        transition: none;
      }
    }

  </style>
  <script src="stitch/router.js" defer></script>
</head>
<body>
  <iframe id="prototype-screen" title="时序智配工作台"></iframe>
</body>
</html>
