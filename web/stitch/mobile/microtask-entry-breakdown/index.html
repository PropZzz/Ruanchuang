<script>
  function insertSyntax(symbol) {
    const textarea = document.getElementById('task-input');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + ' ' + symbol + val.substring(end);
    textarea.focus();
    textarea.setSelectionRange(start + 2, start + 2);
  }

  // Interactive styling for strategy pills
  const strategyInputs = document.querySelectorAll('input[name="dispatch_target"]');
  strategyInputs.forEach(input => {
    input.addEventListener('change', (e) => {
      document.querySelectorAll('.strategy-pill').forEach(pill => {
        pill.classList.remove('bg-surface-container-high', 'active-strategy', 'shadow-sm');
        pill.classList.add('bg-surface-container-lowest');
      });
      const selectedPill = e.target.closest('.strategy-pill');
      if (selectedPill) {
        selectedPill.classList.remove('bg-surface-container-lowest');
        selectedPill.classList.add('bg-surface-container-high', 'active-strategy', 'shadow-sm');
      }
    });
  });

  function handleTaskConfirm() {
    const btn = document.getElementById('submit-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span><span>正在对齐时隙...</span>`;
    btn.classList.add('opacity-90');

    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">done</span><span>已归档至今日缝隙 (16:45)</span>`;
      btn.classList.replace('bg-primary-container', 'bg-tertiary-container');

      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 700);
    }, 600);
  }
