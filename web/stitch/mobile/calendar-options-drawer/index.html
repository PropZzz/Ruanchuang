</main><script>
  (() => {
    const STORAGE_KEY = 'ruanchuang-calendar-options';
    const DEFAULTS = { startHour: 8, endHour: 21, hourHeight: 60, nowLine: true, autoScroll: true };
    const clampHour = value => Math.max(0, Math.min(24, Number(value) || 0));

    function readOptions() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const options = { ...DEFAULTS, ...(stored && typeof stored === 'object' ? stored : {}) };
        return {
          startHour: clampHour(options.startHour),
          endHour: Math.max(1, clampHour(options.endHour)),
          hourHeight: [44, 60, 80].includes(options.hourHeight) ? options.hourHeight : 60,
          nowLine: options.nowLine !== false,
          autoScroll: options.autoScroll !== false,
        };
      } catch (_) {
        return { ...DEFAULTS };
      }
    }

    let options = readOptions();

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(options)); } catch (_) {}
    }

    function selectPill(group, selectedButton) {
      for (const button of group.querySelectorAll('button')) {
        const selected = button === selectedButton;
        button.setAttribute('aria-pressed', String(selected));
      }
    }

    function selectedValue(group) {
      const button = group.querySelector('button[aria-pressed="true"]');
      return button ? Number(button.dataset.hour ?? button.dataset.height) : null;
    }

    function setSwitch(button, checked) {
      const thumb = button.firstElementChild;
      button.setAttribute('aria-checked', String(checked));
      button.classList.toggle('bg-primary-container', checked);
      button.classList.toggle('bg-surface-container-highest', !checked);
      thumb.classList.toggle('translate-x-5', checked);
      thumb.classList.toggle('translate-x-0', !checked);
    }

    function reflect() {
      for (const [groupId, key] of [['calendarStartGroup', 'startHour'], ['calendarEndGroup', 'endHour'], ['calendarDensityGroup', 'hourHeight']]) {
        const group = document.getElementById(groupId);
        for (const button of group.querySelectorAll('button')) {
          const value = Number(button.dataset.hour ?? button.dataset.height);
          button.setAttribute('aria-pressed', String(value === options[key]));
        }
      }
      setSwitch(document.getElementById('calendarNowLineSwitch'), options.nowLine);
      setSwitch(document.getElementById('calendarAutoScrollSwitch'), options.autoScroll);
    }

    // Hour pills intersect between the two groups, so listen per group.
    for (const [groupId, key] of [['calendarStartGroup', 'startHour'], ['calendarEndGroup', 'endHour'], ['calendarDensityGroup', 'hourHeight']]) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', event => {
        const button = event.target.closest('button[data-hour], button[data-height]');
        if (!button) return;
        options = { ...options, [key]: Number(button.dataset.hour ?? button.dataset.height) };
        selectPill(group, button);
        persist();
      });
    }

    document.getElementById('calendarNowLineSwitch').addEventListener('click', event => {
      options = { ...options, nowLine: event.currentTarget.getAttribute('aria-checked') !== 'true' };
      setSwitch(event.currentTarget, options.nowLine);
      persist();
    });

    document.getElementById('calendarAutoScrollSwitch').addEventListener('click', event => {
      options = { ...options, autoScroll: event.currentTarget.getAttribute('aria-checked') !== 'true' };
      setSwitch(event.currentTarget, options.autoScroll);
      persist();
    });

    // 完成 closes through the shared drawer return path ([data-router-return]).
    document.getElementById('calendar-options-reset').addEventListener('click', () => {
      options = { ...DEFAULTS };
      reflect();
      persist();
    });

    reflect();
  })();
  </script></main></section></body></html>
