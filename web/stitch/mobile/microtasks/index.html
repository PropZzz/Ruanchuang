<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta content="mobile_tab" name="shell-type"/>
<title>时序智配 · 微任务</title>
<link href="../assets/882ac670af7a73c9.css" rel="stylesheet"/>
<link href="../assets/e6154908c44c742b.css" rel="stylesheet"/>
<link href="../assets/85b88de6c1273900.css" rel="stylesheet"/>
<link href="../../assets/microtasks.css" rel="stylesheet"/>
<script id="tailwind-config">window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class', theme: { extend: {} } };</script>
<style>
  html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
  body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="mt-mobile">
<div id="mt-page-content">
  <header class="mt-mobile-header">
    <div class="mt-mobile-header-inner">
      <div>
        <h1>微任务</h1>
      </div>
      <a class="rc-btn" data-path="microtask-entry" href="#/microtask-entry">导入清单</a>
    </div>
  </header>

  <main class="mt-page">
    <section aria-label="微任务概览" class="mt-stats">
      <div class="mt-stat">
        <span>待处理</span>
        <strong id="mt-stat-pending">—</strong>
        <small id="mt-stat-pending-note">约 0.0h</small>
      </div>
      <div class="mt-stat">
        <span>已完成</span>
        <strong id="mt-stat-done">—</strong>
        <small id="mt-stat-done-note">今日</small>
      </div>
      <div class="mt-stat">
        <span>积分</span>
        <strong id="mt-stat-points">—</strong>
        <small id="mt-stat-points-note">累计</small>
      </div>
    </section>

    <section aria-label="快速添加" class="mt-quick">
      <div class="mt-quick-copy">
        <h2>快速添加</h2>
        <p>默认 15 分钟</p>
      </div>
      <form class="mt-quick-form" id="mt-quick-form">
        <label class="mt-sr-only" for="nlp-task-input">任务标题</label>
        <input autocomplete="off" id="nlp-task-input" name="microtask_input" placeholder="输入任务，可带 #标签 ~15m !P3" type="text"/>
        <button class="rc-btn rc-btn-primary" type="submit">添加</button>
      </form>
    </section>

    <div class="mt-layout">
      <section aria-label="任务清单" class="mt-main">
        <div class="mt-main-head">
          <div>
            <h2>任务</h2>
          </div>
          <div aria-label="任务筛选" class="mt-tabs" role="tablist">
            <button aria-selected="true" data-filter="queue" role="tab" type="button">队列 <span id="mt-queue-count">0</span></button>
            <button aria-selected="false" data-filter="done" role="tab" type="button">已完成 <span id="mt-done-count">0</span></button>
          </div>
        </div>
        <div id="mt-next-host"></div>
        <div id="mt-groups"></div>
        <div class="mt-empty" hidden id="mt-empty"></div>
      </section>

      <aside aria-label="进度与提醒" class="mt-side">
        <section class="rc-card mt-side-card">
          <div class="mt-side-head">
            <h3>完成情况</h3>
            <strong id="mt-progress-pct">0%</strong>
          </div>
          <div class="mt-bar"><span id="mt-progress-bar"></span></div>
          <p id="mt-progress-copy">0 / 0</p>
          <p id="mt-progress-points">0 积分</p>
        </section>
        <section class="rc-card mt-side-card">
          <h3>积压提醒</h3>
          <p id="mt-backlog-copy">正在读取任务。</p>
          <a class="rc-btn" data-path="focus" href="#/focus">去专注</a>
        </section>
      </aside>
    </div>
  </main>

  <nav aria-label="主导航" class="mt-mnav">
    <a data-path="focus" href="#/focus"><span class="material-symbols-outlined">hourglass_top</span><span>专注</span></a>
    <a data-path="schedule" href="#/schedule"><span class="material-symbols-outlined">calendar_today</span><span>日程</span></a>
    <a aria-current="page" data-path="micro" href="#/micro"><span class="material-symbols-outlined">auto_awesome</span><span>微任务</span></a>
    <a data-path="team" href="#/team"><span class="material-symbols-outlined">groups</span><span>团队</span></a>
    <a data-path="profile" href="#/profile"><span class="material-symbols-outlined">account_circle</span><span>我的</span></a>
  </nav>
</div>

<div aria-hidden="true" class="mt-focus" hidden id="mt-focus">
  <section aria-labelledby="mt-focus-title" aria-modal="true" class="mt-focus-panel" id="mt-focus-panel" role="dialog">
    <button aria-label="关闭专注" class="mt-focus-close" id="mt-focus-close" type="button"><span class="material-symbols-outlined">close</span></button>
    <p class="mt-focus-eyebrow"><span class="material-symbols-outlined">timer</span>专注</p>
    <h2 id="mt-focus-title">任务</h2>
    <p class="mt-focus-meta" id="mt-focus-meta">P3 · 15 分钟</p>
    <div class="mt-focus-ring">
      <svg aria-hidden="true" viewBox="0 0 200 200">
        <circle class="mt-ring-track" cx="100" cy="100" r="88"></circle>
        <circle class="mt-ring-value" cx="100" cy="100" id="mt-ring-value" r="88"></circle>
      </svg>
      <div class="mt-focus-time">
        <strong id="mt-focus-timer">15:00</strong>
        <small id="mt-focus-note">预计 15 分钟</small>
      </div>
    </div>
    <div class="mt-focus-actions">
      <button class="rc-btn rc-btn-primary" id="mt-focus-pause" type="button">暂停</button>
      <button class="rc-btn" hidden id="mt-focus-retry" type="button">重试同步</button>
      <button class="rc-btn" id="mt-focus-end" type="button">关闭</button>
    </div>
    <p class="mt-focus-note">计时保存在本机。</p>
  </section>
</div>

<div aria-hidden="true" class="mt-confirm" hidden id="mt-confirm">
  <section aria-labelledby="mt-confirm-title" aria-modal="true" class="mt-confirm-panel" id="mt-confirm-panel" role="dialog">
    <h3 id="mt-confirm-title">结束专注？</h3>
    <p id="mt-confirm-body">任务还未完成。</p>
    <div class="mt-confirm-actions">
      <button class="rc-btn" data-confirm="keep" type="button">继续专注</button>
      <button class="rc-btn" data-confirm="abandon" type="button">放弃</button>
      <button class="rc-btn rc-btn-primary" data-confirm="done" type="button">标记完成</button>
    </div>
  </section>
</div>

<script src="../../assets/microtasks.js"></script>
</body>
</html>
