<body class="bg-[rgba(24,50,56,0.45)] backdrop-blur-md font-body text-on-surface min-h-screen flex flex-col justify-end">

  <button aria-label="关闭抽屉" class="fixed inset-0 z-0 cursor-default" type="button" id="drawerBackdrop"></button>

  <section class="w-full max-w-[420px] mx-auto bg-surface rounded-t-3xl shadow-[0_-8px_32px_rgba(22,61,61,0.18)] flex flex-col max-h-[85vh] overflow-hidden">

    <!-- 拖动把手 -->

      <div class="w-12 h-1.5 rounded-full bg-outline-variant/60"></div>
    </div>

    <!-- 标题栏 -->
    <div class="h-14 px-5 flex items-center justify-between shrink-0 border-b border-outline-variant/20">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-on-tertiary-container" id="statusIndicator"></span>
        <h2 class="text-base font-headline font-bold text-on-surface tracking-tight leading-none" id="drawerTitle">日程详情</h2>
      </div>
      <button aria-label="关闭抽屉" class="w-11 h-11 -mr-2 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" id="closeBtn">

      </button>
    </div>

    <!-- 主内容区 -->
    <main class="flex-1 overflow-y-auto px-5 pt-4 pb-safe bg-surface" id="drawerContent">

      <!-- 加载状态 -->

        <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-sm text-on-surface-variant">加载中...</span>
      </div>

      <!-- 详情查看模式 -->
      <div class="flex flex-col gap-5 pb-8" id="viewMode" hidden>

        <!-- 标题与标签 -->
        <div class="flex flex-col gap-3">
          <h3 class="text-xl font-headline font-bold text-primary leading-tight" id="detailTitle"></h3>
          <div class="flex flex-wrap items-center gap-2">

            <span class="px-3 py-1 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant" id="detailLoad"></span>
          </div>
        </div>

        <!-- 时间信息卡片 -->
        <div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-3">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[20px]">calendar_today</span>
            <span class="text-sm font-semibold text-on-surface" id="detailDate"></span>

            <div class="flex items-center gap-2">

          <div class="flex items-center gap-2">

        <!-- 操作按钮组 -->
        <div class="flex flex-col gap-2 pt-2">

            <span class="material-symbols-outlined text-[18px]">edit</span>

          <button class="w-full h-10 text-error text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 hover:bg-error-container transition-colors" id="deleteBtn">
            <span class="material-symbols-outlined text-[16px]">delete</span>
            <span>删除日程</span>
          </button>
        </div>

      </div>

      <!-- 编辑模式 -->
      <div class="flex flex-col gap-4 pb-8" id="editMode" hidden>

        <!-- 日程主题 -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider flex items-center justify-between" for="titleInput">

          <div class="bg-surface-container-low rounded-xl p-3.5 flex flex-col gap-1">

            <div class="flex items-center justify-between pt-1">
              <span class="text-[11px] text-error hidden" id="titleError">标题不能为空</span>

            </div>

        <!-- 日期选择 -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider" for="dateInput">日期</label>
          <input type="date" id="dateInput" class="w-full bg-surface-container-low rounded-xl p-3 text-sm font-semibold text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary"/>
          <p id="floatingDateNote" class="text-xs text-on-surface-variant" hidden>尚未固定日期，每天显示；选择日期后将固定到该日。</p>
        </div>

        <!-- 时间与时长 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-on-surface-variant tracking-wider" for="timeInput">开始时间</label>
            <input type="time" id="timeInput" class="w-full bg-surface-container-low rounded-xl p-3 text-sm font-semibold text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary"/>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-on-surface-variant tracking-wider" for="durationInput">时长(分钟)</label>
            <input type="number" id="durationInput" min="5" max="480" step="5" class="w-full bg-surface-container-low rounded-xl p-3 text-sm font-semibold text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="60"/>
          </div>
        </div>

        <!-- 标签选择 -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider">日程属性标签</label>
          <div class="flex flex-wrap gap-2" id="tagGroup">
            <button class="tag-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-tag="方案评审" type="button">方案评审</button>
            <button class="tag-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-tag="跨部门协同" type="button">跨部门协同</button>
            <button class="tag-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-tag="架构编码" type="button">架构编码</button>
            <button class="tag-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-tag="随笔调研" type="button">随笔调研</button>
            <button class="tag-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-tag="会议" type="button">会议</button>
          </div>
        </div>

        <!-- 认知负荷 -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider">认知负荷</label>
          <div class="flex flex-wrap gap-2" id="loadGroup">
            <button class="load-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-load="low" type="button">低</button>
            <button class="load-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-load="medium" type="button">中等</button>
            <button class="load-btn px-3 py-1.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" data-load="high" type="button">高</button>
          </div>
        </div>

        <!-- 提醒设置 -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider">提前提醒</label>
          <div class="grid grid-cols-4 gap-2" id="reminderGroup">
            <button class="reminder-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-minutes="0" type="button">不提醒</button>
            <button class="reminder-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-minutes="10" type="button">10分钟</button>
            <button class="reminder-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-minutes="30" type="button">30分钟</button>
            <button class="reminder-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-minutes="60" type="button">1小时</button>
          </div>
        </div>

        <!-- 重复规则 -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-on-surface-variant tracking-wider">重复周期</label>
          <div class="grid grid-cols-4 gap-2" id="repeatGroup">
            <button class="repeat-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-repeat="none" type="button">不重复</button>
            <button class="repeat-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-repeat="daily" type="button">每天</button>
            <button class="repeat-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-repeat="weekly" type="button">每周</button>
            <button class="repeat-btn py-2 text-center rounded-xl bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-all" data-repeat="monthly" type="button">每月</button>
          </div>
        </div>

        <!-- 保存按钮 -->
        <div class="flex flex-col gap-2 pt-2">
          <button class="w-full h-12 bg-primary text-on-primary font-medium text-sm rounded-xl flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform disabled:opacity-50 disabled:cursor-not-allowed" id="saveBtn" type="button">
            <span class="material-symbols-outlined text-[18px]" id="saveBtnIcon">event_available</span>
            <span id="saveBtnText">保存并写入日程</span>
          </button>
          <button class="w-full h-10 text-on-surface-variant text-xs font-semibold rounded-xl flex items-center justify-center hover:bg-surface-container transition-colors" id="cancelBtn" type="button">取消</button>
        </div>

      </div>

      <!-- 错误状态 -->
      <div class="flex flex-col items-center justify-center py-16 gap-4 text-center" id="errorState" hidden>
        <span class="material-symbols-outlined text-[48px] text-error">error</span>
        <div class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-on-surface">加载失败</span>
          <span class="text-xs text-on-surface-variant" id="errorMessage"></span>
        </div>
        <button class="px-4 py-2 rounded-lg bg-secondary text-on-secondary text-xs font-semibold" id="retryBtn">重试</button>
      </div>

    </main>

  </section>

  <script>
    (() => {
      // 状态管理
      let currentMode = 'loading'; // 'loading' | 'view' | 'edit'
      let currentEntry = null;
      let isNewEntry = false;
      let selectedTag = '跨部门协同';
      let selectedLoad = 'medium';
      let selectedReminder = 30;
      let selectedRepeat = 'none';

      // API基础URL
      const apiBase = (window.__RUANCHUANG_API__ ||
        (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
          ? 'http://127.0.0.1:8000'
          : '/api')).replace(/\/$/, '');

      function authHeaders() {
        const token = localStorage.getItem('access_token') || localStorage.getItem('token');
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      // 模式切换
      function switchMode(mode) {
        currentMode = mode;
        document.getElementById('loadingState').hidden = mode !== 'loading';
        document.getElementById('viewMode').hidden = mode !== 'view';
        document.getElementById('editMode').hidden = mode !== 'edit';
        document.getElementById('errorState').hidden = mode !== 'error';

        if (mode === 'view') {
          document.getElementById('drawerTitle').textContent = '日程详情';
        } else if (mode === 'edit') {
          document.getElementById('drawerTitle').textContent = isNewEntry ? '新建日程' : '编辑日程';
        }
      }

      // 格式化时间
      function formatTime(hour, minute) {
        return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
      }

      function formatReminder(minutes) {
        if (minutes === 0) return '不提醒';
        if (minutes < 60) return `提前${minutes}分钟`;
        return `提前${Math.floor(minutes / 60)}小时`;
      }

      function formatRepeat(repeat) {
        const map = { none: '不重复', daily: '每天', weekly: '每周', monthly: '每月' };
        return map[repeat] || '不重复';
      }

      // 渲染详情模式
      function renderView(entry) {
        document.getElementById('detailTitle').textContent = entry.title || '未命名日程';
        document.getElementById('detailTag').textContent = entry.tag || '未分类';
        document.getElementById('detailLoad').textContent = entry.load === 'high' ? '高负荷' : entry.load === 'low' ? '低负荷' : '中等负荷';
        document.getElementById('detailDate').textContent = entry.day || '未固定日期 · 每天显示';
        document.getElementById('detailStartTime').textContent = formatTime(entry.time?.hour || 0, entry.time?.minute || 0);
        document.getElementById('detailDuration').textContent = Math.round((entry.height || 60) / 80 * 60);
        document.getElementById('detailReminder').textContent = formatReminder(entry.reminderMinutesBefore || 0);
        document.getElementById('detailRepeat').textContent = formatRepeat(entry.repeat || 'none');

        const goalCard = document.getElementById('goalLinkCard');
        if (entry.goalId) {
          goalCard.hidden = false;
          document.getElementById('goalLinkText').textContent = `已关联目标 ID: ${entry.goalId}`;
        } else {
          goalCard.hidden = true;
        }

        switchMode('view');
      }

      // 渲染编辑模式
      function renderEdit(entry) {
        isNewEntry = !entry || !entry.id;

        document.getElementById('titleInput').value = entry?.title || '';
        const floating = Boolean(entry?.id && entry.day == null);
        const now = new Date();
        const localToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        document.getElementById('dateInput').value = floating ? '' : entry?.day || localToday;
        document.getElementById('floatingDateNote').hidden = !floating;
        document.getElementById('timeInput').value = formatTime(entry?.time?.hour ?? 9, entry?.time?.minute ?? 0);
        document.getElementById('durationInput').value = entry ? Math.round((entry.height || 60) / 80 * 60) : 60;

        selectedTag = entry?.tag || '跨部门协同';
        selectedLoad = entry?.load || 'medium';
        selectedReminder = entry?.reminderMinutesBefore ?? 30;
        selectedRepeat = entry?.repeat || 'none';

        updateTagSelection();
        updateLoadSelection();
        updateReminderSelection();
        updateRepeatSelection();
        updateTitleCounter();

        switchMode('edit');
      }

      // 按钮组选择更新
      function updateTagSelection() {
        document.querySelectorAll('.tag-btn').forEach(btn => {
          const isSelected = btn.dataset.tag === selectedTag;
          btn.classList.toggle('bg-secondary-container', isSelected);
          btn.classList.toggle('text-on-secondary-container', isSelected);
          btn.classList.toggle('font-semibold', isSelected);
          btn.classList.toggle('bg-surface-container', !isSelected);
          btn.classList.toggle('text-on-surface-variant', !isSelected);
        });
      }

      function updateLoadSelection() {
        document.querySelectorAll('.load-btn').forEach(btn => {
          const isSelected = btn.dataset.load === selectedLoad;
          btn.classList.toggle('bg-primary', isSelected);
          btn.classList.toggle('text-on-primary', isSelected);
          btn.classList.toggle('font-semibold', isSelected);
          btn.classList.toggle('bg-surface-container', !isSelected);
          btn.classList.toggle('text-on-surface-variant', !isSelected);
        });
      }

      function updateReminderSelection() {
        document.querySelectorAll('.reminder-btn').forEach(btn => {
          const isSelected = Number(btn.dataset.minutes) === selectedReminder;
          btn.classList.toggle('bg-primary', isSelected);
          btn.classList.toggle('text-on-primary', isSelected);
          btn.classList.toggle('font-semibold', isSelected);
          btn.classList.toggle('bg-surface-container', !isSelected);
          btn.classList.toggle('text-on-surface-variant', !isSelected);
        });
      }

      function updateRepeatSelection() {
        document.querySelectorAll('.repeat-btn').forEach(btn => {
          const isSelected = btn.dataset.repeat === selectedRepeat;
          btn.classList.toggle('bg-primary', isSelected);
          btn.classList.toggle('text-on-primary', isSelected);
          btn.classList.toggle('font-semibold', isSelected);
          btn.classList.toggle('bg-surface-container', !isSelected);
          btn.classList.toggle('text-on-surface-variant', !isSelected);
        });
      }

      function updateTitleCounter() {
        const title = document.getElementById('titleInput').value;
        document.getElementById('titleCounter').textContent = `${title.length}/60`;
      }

      // 事件监听
      document.getElementById('titleInput').addEventListener('input', updateTitleCounter);

      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedTag = btn.dataset.tag;
          updateTagSelection();
        });
      });

      document.querySelectorAll('.load-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedLoad = btn.dataset.load;
          updateLoadSelection();
        });
      });

      document.querySelectorAll('.reminder-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedReminder = Number(btn.dataset.minutes);
          updateReminderSelection();
        });
      });

      document.querySelectorAll('.repeat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedRepeat = btn.dataset.repeat;
          updateRepeatSelection();
        });
      });

      // 关闭抽屉
      function closeDrawer() {
        window.dispatchEvent(new CustomEvent('stitch:close-drawer', { detail: { saved: false } }));
      }

      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.getElementById('closeBtn').addEventListener('click', closeDrawer);
      document.getElementById('cancelBtn').addEventListener('click', closeDrawer);

      // 切换到编辑模式
      document.getElementById('editBtn').addEventListener('click', () => {
        renderEdit(currentEntry);
      });

      // 删除日程
      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!currentEntry?.id) return;

        if (!confirm(`确认删除日程"${currentEntry.title}"?\n\n此操作不可撤销。`)) return;

        try {
          const response = await fetch(`${apiBase}/schedule/${currentEntry.id}`, {
            method: 'DELETE',
            headers: { ...authHeaders() },
          });

          if (!response.ok) throw new Error('删除失败');

          window.dispatchEvent(new CustomEvent('stitch:schedule-deleted', { detail: { id: currentEntry.id } }));
          window.dispatchEvent(new CustomEvent('stitch:close-drawer', { detail: { saved: true } }));
        } catch (error) {
          alert('删除失败: ' + error.message);
        }
      });

      // 保存日程
      document.getElementById('saveBtn').addEventListener('click', async () => {
        const title = document.getElementById('titleInput').value.trim();
        if (!title) {
          document.getElementById('titleError').classList.remove('hidden');
          return;
        }
        document.getElementById('titleError').classList.add('hidden');

        const day = document.getElementById('dateInput').value || (currentEntry?.id && currentEntry.day == null ? null : '');
        const [hour, minute] = document.getElementById('timeInput').value.split(':').map(Number);
        const duration = Number(document.getElementById('durationInput').value);
        if (day === '' || !Number.isFinite(hour) || !Number.isFinite(minute) || !Number.isFinite(duration) || duration < 5 || duration > 1440) {
          alert('请选择有效日期、开始时间，以及 5 至 1440 分钟的时长');
          return;
        }

        const payload = {
          color: currentEntry?.color ?? 0,
          goalId: currentEntry?.goalId ?? null,
          goalTaskId: currentEntry?.goalTaskId ?? null,
          repeatUntil: currentEntry?.repeatUntil ?? null,
          title,
          tag: selectedTag,
          load: selectedLoad,
          day,
          time: { hour, minute },
          height: duration * 80 / 60,
          reminderMinutesBefore: selectedReminder,
          repeat: selectedRepeat,
        };

        if (!isNewEntry && currentEntry?.id) {
          payload.id = currentEntry.id;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        document.getElementById('saveBtnText').textContent = '保存中...';
        document.getElementById('saveBtnIcon').textContent = 'schedule';

        try {
          const url = isNewEntry ? `${apiBase}/schedule` : `${apiBase}/schedule/${currentEntry.id}`;
          const method = isNewEntry ? 'POST' : 'PUT';

          const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || '保存失败');
          }

          const savedEntry = await response.json();
          currentEntry = savedEntry;
          isNewEntry = false;
          renderView(savedEntry);

          window.dispatchEvent(new CustomEvent('stitch:schedule-saved', { detail: savedEntry }));
          window.dispatchEvent(new CustomEvent('stitch:close-drawer', { detail: { saved: true } }));
        } catch (error) {
          alert('保存失败: ' + error.message);
        } finally {
          saveBtn.disabled = false;
          document.getElementById('saveBtnText').textContent = '保存并写入日程';
          document.getElementById('saveBtnIcon').textContent = 'event_available';
        }
      });

      // 监听外部打开事件
      window.addEventListener('stitch:open-schedule-detail', (event) => {
        const { entry, mode } = event.detail;
        currentEntry = entry;

        if (mode === 'edit' || !entry?.id) {
          renderEdit(entry);
        } else {
          renderView(entry);
        }
      });

      // 错误状态重试
      document.getElementById('retryBtn').addEventListener('click', () => {
        if (currentEntry?.id) {
          // 重新加载详情
          switchMode('loading');
          setTimeout(() => renderView(currentEntry), 500);
        }
      });

      // 初始模式
      switchMode('loading');
    })();
  </script>

</body>
</html>
